<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>SMC Incident — HSE Platform</title>

    <!-- Inline splash screen styles — renders immediately, no external CSS needed -->
    <style>
      #splash-screen {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
        z-index: 99999;
        transition: opacity 0.4s ease, visibility 0.4s ease;
      }
      #splash-screen.fade-out {
        opacity: 0;
        visibility: hidden;
      }
      #splash-logo {
        width: 56px;
        height: 56px;
        background: linear-gradient(135deg, #2563eb, #1d4ed8);
        border-radius: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 8px 32px rgba(37, 99, 235, 0.35);
        margin-bottom: 20px;
        animation: splash-pulse 2s ease-in-out infinite;
      }
      #splash-logo svg {
        width: 28px;
        height: 28px;
        color: white;
      }
      #splash-title {
        color: #fff;
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 16px;
        font-weight: 700;
        letter-spacing: 0.02em;
        margin: 0;
      }
      #splash-sub {
        color: #64748b;
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.25em;
        text-transform: uppercase;
        margin-top: 4px;
      }
      #splash-spinner {
        width: 24px;
        height: 24px;
        border: 2px solid rgba(255,255,255,0.1);
        border-top-color: #3b82f6;
        border-radius: 50%;
        animation: splash-spin 0.8s linear infinite;
        margin-top: 32px;
      }
      @keyframes splash-spin {
        to { transform: rotate(360deg); }
      }
      @keyframes splash-pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.05); }
      }
    </style>
  </head>
  <body>
    <!-- Splash screen — visible immediately while JS loads & parses -->
    <div id="splash-screen">
      <div id="splash-logo">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          <path d="m9 12 2 2 4-4"/>
        </svg>
      </div>
      <p id="splash-title">SMC Incident</p>
      <p id="splash-sub">HSE Platform</p>
      <div id="splash-spinner"></div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Remove splash once React has rendered -->
    <script>
      (function() {
        var observer = new MutationObserver(function() {
          if (document.getElementById('root').children.length > 0) {
            observer.disconnect();
            var splash = document.getElementById('splash-screen');
            if (splash) {
              splash.classList.add('fade-out');
              setTimeout(function() { splash.remove(); }, 500);
            }
          }
        });
        observer.observe(document.getElementById('root'), { childList: true });
      })();
    </script>
  </body>
</html>
