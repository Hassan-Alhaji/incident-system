# Nginx Server Configuration for incident-system (UAT Environment)
# Location on OCI server: /etc/nginx/conf.d/incident-system.conf

server {
    listen 80;
    server_name 10.39.1.140 10.39.1.140.nip.io HSE.saudimotorsport.com _; # Catch-all and temporary domains

    # --------------------------------------------------------------------
    # Upload & Body Size Configuration (Fix for HTTP 413)
    # --------------------------------------------------------------------
    client_max_body_size 50M;

    # --------------------------------------------------------------------
    # Security Configuration
    # --------------------------------------------------------------------
    server_tokens off; # Hide Nginx version for security

    # --------------------------------------------------------------------
    # Frontend Configuration (Serving built React files)
    # --------------------------------------------------------------------
    root /var/www/incident-system/frontend/dist;
    index index.html;

    # Gzip Compression for faster page loads
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/x-javascript application/xml application/json;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # --------------------------------------------------------------------
    # Backend API Configuration (Reverse Proxy to Node.js on port 3000)
    # --------------------------------------------------------------------
    location /api/ {
        client_max_body_size 50M;
        proxy_pass http://127.0.0.1:3000/api/;
        proxy_http_version 1.1;
        
        # Enable connection upgrade (required for websockets if used)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        
        # Forward client identifiers (Critical for Rate Limiting & Logs)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeout thresholds
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        # Disable response buffering
        proxy_buffering off;
    }

    # --------------------------------------------------------------------
    # Backend Static Uploads Directory Configuration
    # --------------------------------------------------------------------
    location /uploads/ {
        client_max_body_size 50M;
        proxy_pass http://127.0.0.1:3000/uploads/;
        
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
